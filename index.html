<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/videogame_asset.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVault</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#66c0f4",
              "background-light": "#f6f7f8",
              "background-dark": "#101b22",
              "surface": "#1b2838",
              "accent": "#171d25"
            },
            fontFamily: {
              display: ["Inter"]
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            }
          }
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        min-height: max(884px, 100dvh);
      }

      .bg-steam-gradient {
        background: radial-gradient(circle at top left, #1b2838 0%, #101b22 100%);
      }

      .btn-blue-gradient {
        background: linear-gradient(to right, #47bfff 0%, #1a44c2 100%);
      }
    </style>
  </head>

  <body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
